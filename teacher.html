<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teacher view · Fluids Inspector</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .tile b{display:block;font-family:Fraunces,serif;font-size:26px}
  .tile span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%}
  .panel{margin-bottom:14px}
  .panel h3{font-size:18px;margin-bottom:10px}
  .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ctl input,.ctl select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font:inherit}
  .ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
  .muted{color:var(--muted);font-size:13px}
  .scroll{max-height:420px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="badge">T</div><div class="who"><span>Teacher view</span><b>Fluids Inspector</b></div></div>
  <div class="panel ctl" id="ctl">
    <input id="key" placeholder="Teacher key" type="password">
    <button class="btn" id="load">Load activity</button>
    <select id="student" style="display:none"></select>
    <span class="muted" id="status"></span>
  </div>
  <div id="out"></div>
</div>
<script src="config.js"></script>
<script src="questions.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ROWS = [];
$("key").value = localStorage.getItem("fi.teacherKey") || "";

$("load").onclick = async () => {
  if (!LOG_URL) { $("status").textContent = "Set LOG_URL in config.js first."; return; }
  const key = $("key").value.trim();
  localStorage.setItem("fi.teacherKey", key);
  $("status").textContent = "Loading…";
  try {
    const r = await fetch(LOG_URL + "?key=" + encodeURIComponent(key));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    ROWS = j.rows;
    const names = [...new Set(ROWS.map(r => r.student).filter(Boolean))];
    $("student").innerHTML = names.map(n => `<option>${esc(n)}</option>`).join("");
    $("student").style.display = names.length ? "" : "none";
    $("status").textContent = `${ROWS.length} events · updated ${new Date().toLocaleTimeString()}`;
    render();
  } catch (e) { $("status").textContent = "Couldn't load: " + e.message; }
};
$("student").onchange = render;

function fmtDur(s){ s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h}h ${m}m`:`${m}m`; }
function color(p){ return p>=.9?"var(--ok)":p>=.7?"var(--gold-d)":"var(--bad)"; }

function render() {
  const who = $("student").value;
  const R = ROWS.filter(r => r.student === who);
  const ans = R.filter(r => r.event === "answer");
  const first = ans.filter(r => +r.attempt === 1);
  const firstOk = first.filter(r => +r.isCorrect === 1).length;
  const hints = R.filter(r => r.event === "hint").length;
  const sessions = new Set(R.map(r => r.session)).size;
  const timeOn = ans.reduce((n, r) => n + (+r.timeSec || 0), 0);
  const last = R.length ? new Date(R[R.length - 1].serverTime) : null;
  const xp = R.length ? Math.max(...R.map(r => +r.xp || 0)) : 0;

  // per case
  const caseRows = CASES.map(c => {
    const f = first.filter(r => r.caseId === c.id || (r.caseId === "final" && r.qid.startsWith(c.id + "q")));
    const ok = f.filter(r => +r.isCorrect === 1).length;
    const done = R.some(r => r.event === "case_complete" && r.caseId === c.id);
    return { c, n: f.length, p: f.length ? ok / f.length : null, done };
  });

  // most missed
  const miss = {};
  ans.filter(r => +r.isCorrect === 0).forEach(r => {
    const m = miss[r.qid] ||= { q: r.question, n: 0, picks: {} , correct: r.correct};
    m.n++; m.picks[r.chosen] = (m.picks[r.chosen] || 0) + 1;
  });
  const missed = Object.values(miss).sort((a, b) => b.n - a.n).slice(0, 12);

  $("out").innerHTML = `
  <div class="tiles">
    <div class="tile"><b>${first.length ? Math.round(firstOk / first.length * 100) : 0}%</b><span>First-try accuracy</span></div>
    <div class="tile"><b>${first.length}</b><span>Questions attempted</span></div>
    <div class="tile"><b>${caseRows.filter(x => x.done).length}/${CASES.length}</b><span>Cases closed</span></div>
    <div class="tile"><b>${xp}</b><span>XP</span></div>
    <div class="tile"><b>${hints}</b><span>Hints used</span></div>
    <div class="tile"><b>${fmtDur(timeOn)}</b><span>Time answering · ${sessions} sessions</span></div>
  </div>
  <p class="muted">Last active: ${last ? last.toLocaleString() : "—"}</p>

  <div class="panel"><h3>By topic (first try)</h3><table>
    <tr><th>Case</th><th>Answered</th><th>Accuracy</th><th></th></tr>
    ${caseRows.map(x => `<tr><td>${x.c.icon} ${esc(x.c.title)}<div class="muted">${esc(x.c.outcome)}</div></td>
      <td>${x.n}</td><td>${x.p === null ? "—" : Math.round(x.p * 100) + "%"}</td>
      <td style="width:30%"><div class="bar"><i style="width:${(x.p || 0) * 100}%;background:${color(x.p || 0)}"></i></div></td></tr>`).join("")}
  </table></div>

  <div class="panel"><h3>Where she's going wrong</h3>
    ${missed.length ? `<table><tr><th>Question</th><th>Wrong</th><th>What she picked</th></tr>
    ${missed.map(m => `<tr><td>${esc(m.q)}<div class="muted">✔ ${esc(m.correct)}</div></td><td class="bad">${m.n}×</td>
      <td>${Object.entries(m.picks).map(([k, v]) => `${esc(k)} <span class="muted">(${v})</span>`).join("<br>")}</td></tr>`).join("")}</table>`
      : `<p class="muted">No wrong answers yet.</p>`}
  </div>

  <div class="panel"><h3>Activity timeline</h3><div class="scroll"><table>
    <tr><th>When</th><th>Event</th><th>Detail</th></tr>
    ${R.slice().reverse().slice(0, 300).map(r => `<tr><td class="muted">${new Date(r.serverTime).toLocaleString()}</td>
      <td>${esc(r.event)}</td><td>${r.event === "answer"
        ? `<span class="${+r.isCorrect ? "ok" : "bad"}">${+r.isCorrect ? "✔" : "✘"}</span> ${esc(r.question)}<div class="muted">picked “${esc(r.chosen)}” · try ${r.attempt}${+r.hint ? " · hint" : ""} · ${r.timeSec}s</div>`
        : esc([r.caseTitle, r.detail].filter(Boolean).join(" — "))}</td></tr>`).join("")}
  </table></div></div>`;
}
</script>
</body>
</html>
